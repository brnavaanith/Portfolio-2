<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <rect width="1000" height="700" fill="#ffffff" stroke="#003b73" stroke-width="14"/>
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#f59e0b" stroke-width="2"/>

  <!-- Left/Right decorative corner accents -->
  <polygon points="20,20 80,20 20,80" fill="#003b73"/>
  <polygon points="20,20 120,20 20,40" fill="#f59e0b"/>
  <polygon points="980,680 920,680 980,620" fill="#003b73"/>
  <polygon points="980,680 880,680 980,660" fill="#f59e0b"/>

  <!-- Top Left Brand -->
  <g transform="translate(70, 60)">
    <text x="0" y="40" fill="#ff7a00" font-family="sans-serif" font-size="28" font-weight="700">simpli<tspan fill="#007cc3">learn</tspan></text>
    <text x="145" y="40" fill="#007cc3" font-family="sans-serif" font-size="28" font-weight="800">| SkillUP</text>
  </g>

  <!-- Blue Right Side Ribbon -->
  <g transform="translate(800, 20)">
    <rect x="0" y="0" width="85" height="420" fill="#0b2545"/>
    <line x1="25" y1="0" x2="25" y2="420" stroke="#f59e0b" stroke-width="3"/>
    <line x1="60" y1="0" x2="60" y2="420" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="70" y="195" fill="#475569" font-family="sans-serif" font-size="24" font-weight="600" letter-spacing="1">
    CERTIFICATE OF
  </text>
  <text x="70" y="255" fill="#1e293b" font-family="sans-serif" font-size="52" font-weight="800" letter-spacing="1">
    COMPLETION
  </text>

  <!-- Recipient Name -->
  <text x="70" y="365" fill="#003b73" font-family="sans-serif" font-size="44" font-weight="800">
    NAVAANITH B R
  </text>
  <line x1="70" y1="380" x2="600" y2="380" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="70" y="420" fill="#64748b" font-family="sans-serif" font-size="16">
    has successfully completed the online course:
  </text>
  <text x="70" y="455" fill="#0f172a" font-family="sans-serif" font-size="24" font-weight="700">
    Introduction to C plus plus
  </text>

  <text x="70" y="505" fill="#64748b" font-family="sans-serif" font-size="14" max-width="500">
    This professional has demonstrated initiative and a commitment to deepening their skills
  </text>
  <text x="70" y="525" fill="#64748b" font-family="sans-serif" font-size="14">
    and advancing their career. Well done!
  </text>

  <!-- Seal / Badge on right -->
  <g transform="translate(842, 540)">
    <!-- Rosette / Seal -->
    <circle cx="0" cy="0" r="75" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="66" fill="#003b73"/>
    <circle cx="0" cy="0" r="54" fill="#ffffff"/>
    <text x="0" y="10" fill="#003b73" font-family="sans-serif" font-size="34" font-weight="900" text-anchor="middle">|i|</text>
  </g>

  <!-- Verified Stamp overlay watermark -->
  <g transform="translate(420, 540) rotate(-15)">
    <ellipse cx="0" cy="0" rx="90" ry="40" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.4"/>
    <text x="0" y="10" fill="#22c55e" font-family="sans-serif" font-size="24" font-weight="800" text-anchor="middle" opacity="0.5">
      VERIFIED
    </text>
  </g>

  <!-- Date & Code -->
  <text x="70" y="605" fill="#1e293b" font-family="sans-serif" font-size="16" font-weight="600">
    28<tspan font-size="11" dy="-5">th</tspan><tspan font-size="16" dy="5"> May 2026</tspan>
  </text>
  <text x="70" y="630" fill="#64748b" font-family="sans-serif" font-size="13">
    Certificate code : 10278607
  </text>

  <!-- Signature -->
  <g transform="translate(560, 560)">
    <path d="M10 25 Q30 5, 50 20 T90 10" fill="none" stroke="#003b73" stroke-width="2"/>
    <line x1="0" y1="40" x2="160" y2="40" stroke="#cbd5e1" stroke-width="1"/>
    <text x="80" y="58" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Krishna Kumar</text>
    <text x="80" y="74" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">CEO, Simplilearn</text>
  </g>
</svg>
