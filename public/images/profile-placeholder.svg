<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle tech pattern -->
  <circle cx="200" cy="160" r="85" fill="none" stroke="#2563eb" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="200" cy="160" r="105" fill="none" stroke="#3b82f6" stroke-opacity="0.1" stroke-width="1"/>
  
  <!-- Avatar Silhouette / Initial Badge -->
  <circle cx="200" cy="160" r="70" fill="url(#accentGrad)" opacity="0.15"/>
  <circle cx="200" cy="135" r="28" fill="#3b82f6" opacity="0.8"/>
  <path d="M145 205 C145 175, 170 170, 200 170 C230 170, 255 175, 255 205 Z" fill="#3b82f6" opacity="0.8"/>

  <!-- Badge / Initials -->
  <rect x="172" y="146" width="56" height="28" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="165" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">NBR</text>

  <!-- Label area -->
  <rect x="50" y="270" width="300" height="85" rx="12" fill="#030712" fill-opacity="0.7" stroke="#1e293b" stroke-width="1.5"/>
  <text x="200" y="298" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
