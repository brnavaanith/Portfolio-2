<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091024"/>
      <stop offset="60%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#142852"/>
    </linearGradient>
    <linearGradient id="shAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#shBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Technical Grid pattern -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Simulated Platform Dashboard Window -->
  <rect x="70" y="55" width="660" height="310" rx="12" fill="#050b18" fill-opacity="0.9" stroke="#1d4ed8" stroke-opacity="0.4" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="70" y="55" width="660" height="36" rx="12" fill="#0b1329"/>
  <circle cx="95" cy="73" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="112" cy="73" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="129" cy="73" r="5" fill="#22c55e" opacity="0.8"/>
  <text x="400" y="77" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle" font-weight="500">sharehope.platform / donation-ngo-portal</text>

  <!-- UI Mockup Wireframe -->
  <rect x="100" y="110" width="160" height="70" rx="8" fill="#0f1f3d" stroke="#2563eb" stroke-width="1" stroke-opacity="0.5"/>
  <text x="115" y="135" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">DONOR PORTAL</text>
  <text x="115" y="155" fill="#94a3b8" font-family="sans-serif" font-size="10">Active resource listings</text>

  <rect x="280" y="110" width="160" height="70" rx="8" fill="#0f1f3d" stroke="#2563eb" stroke-width="1" stroke-opacity="0.5"/>
  <text x="295" y="135" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">NGO VERIFICATION</text>
  <text x="295" y="155" fill="#94a3b8" font-family="sans-serif" font-size="10">Direct donation channel</text>

  <rect x="460" y="110" width="230" height="70" rx="8" fill="#0f1f3d" stroke="#2563eb" stroke-width="1" stroke-opacity="0.5"/>
  <text x="475" y="135" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">ADMIN CONTROL</text>
  <text x="475" y="155" fill="#94a3b8" font-family="sans-serif" font-size="10">Verification &amp; management</text>

  <!-- Central Donation Flow Graphic -->
  <rect x="100" y="200" width="590" height="140" rx="8" fill="#0a1226" stroke="#1e293b" stroke-width="1"/>
  <text x="395" y="245" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    ShareHope — Donation &amp; NGO Platform
  </text>
  <text x="395" y="275" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">
    Connecting donors with verified NGOs for transparent resource distribution
  </text>
  
  <g transform="translate(230, 295)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#1e293b"/>
    <text x="50" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Donors</text>
    <path d="M110 13 L140 13 M135 8 L142 13 L135 18" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <rect x="150" y="0" width="100" height="26" rx="13" fill="#1d4ed8"/>
    <text x="200" y="17" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">ShareHope</text>
    <path d="M260 13 L290 13 M285 8 L292 13 L285 18" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <rect x="300" y="0" width="100" height="26" rx="13" fill="#1e293b"/>
    <text x="350" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">NGOs</text>
  </g>

  <!-- Bottom Placeholder Indicator Bar -->
  <rect x="230" y="388" width="340" height="34" rx="8" fill="#0b1329" stroke="#2563eb" stroke-width="1"/>
  <text x="400" y="410" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    PROJECT IMAGE PLACEHOLDER (FEATURED)
  </text>
</svg>
