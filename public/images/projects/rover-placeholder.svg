<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="roverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="60%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#172342"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#roverBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Technical Rover Blueprint Overlay -->
  <g opacity="0.2" stroke="#3b82f6" stroke-width="1">
    <circle cx="400" cy="200" r="140" fill="none" stroke-dasharray="4 6"/>
    <circle cx="400" cy="200" r="90" fill="none"/>
    <line x1="150" y1="200" x2="650" y2="200"/>
    <line x1="400" y1="50" x2="400" y2="350"/>
  </g>

  <!-- Rover Chassis Schematic -->
  <!-- 4 Wheels -->
  <rect x="230" y="110" width="45" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="525" y="110" width="45" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="230" y="225" width="45" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="525" y="225" width="45" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>

  <!-- Main Chassis Frame -->
  <rect x="290" y="125" width="220" height="160" rx="14" fill="#0f1f3d" stroke="#60a5fa" stroke-width="2"/>

  <!-- Ultrasonic Sensor on Front -->
  <rect x="360" y="98" width="80" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="382" cy="110" r="7" fill="#0284c7"/>
  <circle cx="418" cy="110" r="7" fill="#0284c7"/>
  <text x="400" y="90" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">ULTRASONIC OBSTACLE SENSOR</text>

  <!-- Environmental Sensor Blocks on Board -->
  <rect x="315" y="150" width="75" height="48" rx="6" fill="#13274f" stroke="#3b82f6" stroke-width="1"/>
  <text x="352" y="172" fill="#93c5fd" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">TEMP SENSOR</text>
  <text x="352" y="187" fill="#cbd5e1" font-family="sans-serif" font-size="8" text-anchor="middle">Environment</text>

  <rect x="410" y="150" width="75" height="48" rx="6" fill="#13274f" stroke="#3b82f6" stroke-width="1"/>
  <text x="447" y="172" fill="#93c5fd" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">GAS / SMOKE</text>
  <text x="447" y="187" fill="#cbd5e1" font-family="sans-serif" font-size="8" text-anchor="middle">Hazard Detector</text>

  <rect x="315" y="215" width="170" height="48" rx="6" fill="#182c58" stroke="#2563eb" stroke-width="1"/>
  <text x="400" y="235" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">CONTROLLER &amp; MOTOR DRIVERS</text>
  <text x="400" y="250" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">4-Wheel Independent Drive + Battery Power</text>

  <!-- Title & Blueprint Info -->
  <text x="400" y="340" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    Smart Search &amp; Rescue Rover Prototype
  </text>
  <text x="400" y="365" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">
    Autonomous Obstacle Avoidance · Environmental Monitoring · Hazard Sensing
  </text>

  <!-- Placeholder Badge -->
  <rect x="250" y="390" width="300" height="32" rx="8" fill="#0b1329" stroke="#3b82f6" stroke-width="1"/>
  <text x="400" y="411" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    PROJECT IMAGE PLACEHOLDER
  </text>
</svg>
